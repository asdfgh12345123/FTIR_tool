name: Feature request
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 请先描述当前痛点。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望新增或改进的内容。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 使用场景
      description: 例如论文绘图、阻燃材料、批量处理等。
