name: Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 请简要说明你遇到了什么问题。
      placeholder: 例如：多谱模式下图例中文显示异常。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写清楚如何复现。
      placeholder: |
        1. 打开 ftir_gui.py
        2. 选择两个 FTIR 文件
        3. 点击生成多谱图
        4. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        OS: Windows 11
        Python: 3.12
        matplotlib: 3.x
        scipy: 1.x
