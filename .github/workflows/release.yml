name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --collect-all matplotlib ftir_gui.py --name FTIR_Tool

      - name: Package release files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\FTIR_Tool.exe "release\FTIR Tool.exe"
          Copy-Item README.md release\README.md
          if (Test-Path LICENSE) { Copy-Item LICENSE release\LICENSE }
          @'
          请优先下载并解压 FTIR_Tool_Windows_Portable.zip 使用，不要下载 GitHub 自动生成的 Source code (zip/tar.gz)。

          使用方法：
          1. 解压当前压缩包
          2. 双击“启动 FTIR Tool.bat”
          3. 如果 Windows 弹出安全提示，请选择“更多信息” -> “仍要运行”

          如果你熟悉 Windows 程序，也可以直接双击“FTIR Tool.exe”。
          '@ | Set-Content -Encoding utf8 "release\使用说明.txt"
          @'
          @echo off
          cd /d "%~dp0"
          start "" "FTIR Tool.exe"
          '@ | Set-Content -Encoding ascii "release\启动 FTIR Tool.bat"
          Compress-Archive -Path release\* -DestinationPath "FTIR_Tool_Windows_Portable.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Windows 用户下载说明

            请下载：

            - `FTIR_Tool_Windows_Portable.zip`

            请不要下载下面 GitHub 自动生成的：

            - `Source code (zip)`
            - `Source code (tar.gz)`

            上面两个是源码，不是可直接运行的程序。

            使用方法：

            1. 下载 `FTIR_Tool_Windows_Portable.zip`
            2. 解压压缩包
            3. 双击 `启动 FTIR Tool.bat`

            如果你熟悉 Windows 程序，也可以直接双击 `FTIR Tool.exe`。
          files: |
            release/FTIR Tool.exe
            FTIR_Tool_Windows_Portable.zip
